# Copy to config.yaml and adjust.
# Secrets come from the environment or from a .env file next to this one:
# ${OLLAMA_API_KEY}, ${TELEGRAM_BOT_TOKEN}, ${TELEGRAM_CHAT_ID},
# ${TELEGRAM_JUNTAS_CHAT_ID}, ${GOOGLECHAT_WEBHOOK_URL}.
# Write a literal dollar sign in a value as $$; comments are not expanded.

# Used when neither --log-level, -v/-q nor NEWSMERGER_LOG_LEVEL set a level.
# log_level: info

sources:
  - id: elperiodicomediterraneo-castello
    name: El Periódico Mediterraneo (Castelló ciudad)
    provider: prensaiberica_plain
    url: https://www.elperiodicomediterraneo.com/castello

  - id: castelloninformacion-castello
    name: Castellón información (Castelló ciudad)
    provider: castelloninformacion
    url: https://www.castelloninformacion.com/noticies/castello/

  - id: castellonplaza
    name: Castellón Plaza
    provider: plaza
    url: https://castellonplaza.com/castellon9/

  - id: the-guardian-spain
    name: The Guardian (Spain)
    provider: theguardian
    url: https://www.theguardian.com/world/spain

  # Used only by the workflows that name it (see `workflows` below).
  - id: juntagobiernolocal
    name: Junta de Gobierno Local
    provider: csjuntasgobierno
    url: https://www.castello.es/es/sesiones
    default: false

  # Any RSS or Atom feed. `options` override, for this source only, the
  # options in the provider's plugin section.
  # - id: some-blog
  #   name: Some blog
  #   provider: feedreader
  #   url: https://blog.example.com/feed.xml
  #   options:
  #     article_selector: article .post-body  # fetch the full article

cache:
  expiration: 21600

# Plugins and their options; options left out take the plugin's defaults, so
# an empty section enables a plugin as is. Providers, processors, remixers
# and sinks that sources and entries name load on their own, with their
# defaults, after the plugins listed here: list them only to give them
# options. Only the `process`, `remix` and `deliver` entries run.
plugins:
  # Providers with options.
  # feedreader:
  #   article_selector: article  # default for every feedreader source

  # LLMs, for the processors that use them. Without any, those processors
  # log an error and do nothing.
  ollama:
    api_base: http://localhost:11434
    api_key: ${OLLAMA_API_KEY}
    chat_model: gemma4:12b
    embed_model: mxbai-embed-large:latest

  # LLM processors: `llm:` picks the LLM (default: the first listed) and
  # `model:` overrides its default model, for every run of the processor.
  # summarize and embed, without a section: the first LLM and its
  # chat_model or embed_model.
  tagger:
    llm: ollama
    model: gemma4:12b

  # Remixers: the defaults of their `remix` entries.
  feedgenerator:
    title: Castelló news
  grouping:                          # singlelink, avglink and embeddings
  digest:                            # sends a week of articles per source
    days: 7

  # Sinks: the defaults of their `deliver` entries.
  telegram:                          # the telegram and telegram_artifacts sinks
    bot_token: ${TELEGRAM_BOT_TOKEN} # optional, like the section: entries
    chat_id: ${TELEGRAM_CHAT_ID}     # may name their own bot and chat
  googlechat:                        # summarized items, by incoming webhook
    url: ${GOOGLECHAT_WEBHOOK_URL}   # or `channel` (space id) and `token`

# The `default` workflow: every source without `default: false`.
#
# The runs of `process`, in order. Each writes one annotation key, the
# processor's own unless the entry names another with `key`; a key is written
# by one entry per item. `options` override the plugin section for that run.
process:
  - markdownify                      # markdown
  - summarize                        # summary
  - tagger                           # tags
  - embed                            # tags_embedding
  - processor: embed
    options:
      input: markdown                # markdown_embedding
  # A second summary, in Spanish, with its own prompt and model:
  # - processor: summarize
  #   key: summary/es
  #   options:
  #     prompt: "Resume en español el siguiente artículo:\n\n"
  #     model: gemma4:27b

# The runs of `remix`, in order. Each saves its artifacts under its key, the
# remixer's own unless the entry names another; keys are unique across
# workflows.
remix:
  - feedgenerator                    # feedgenerator/feed
  - singlelink
  - avglink
  - embeddings
  - digest                           # digest/<source>/<since>_<until>
  # - remixer: feedgenerator         # short/feed
  #   key: short
  #   options: {title: Headlines, max_items: 10}

# The runs of `deliver`, in order. Each records its deliveries under its key,
# the sink's own unless the entry names another; keys are unique per
# workflow. Every entry takes `interval` (minutes between deliveries, oldest
# first; default 0), `max_per_run` (default 5), `max_retries` and `lookback`.
deliver:
  - sink: telegram                   # summarized items (`summary`)
    options:
      interval: 30
      item_image: true               # the item's image as a photo, if any
      item_url_text: original article # the link to the article
      summary: summary               # the annotation posted, e.g. summary/es
      item_url_preview: false        # Telegram's link preview, text posts only
  - sink: telegram_artifacts         # artifacts, as documents
    options: {artifacts: [digest]}
  - sink: googlechat
    options:
      item_image: true               # the item's image as a card, if any
      item_url_text: original article # the link to the article

# More workflows, run with `-w NAME` (one cron line each). A workflow sees only
# its sources; two workflows may write the same process key only if they
# share no source. Its deliveries are recorded as `<name>/<key>`.
workflows:
  - name: juntas-channel
    sources: [juntagobiernolocal]
    process: [markdownify, summarize]
    deliver:
      - sink: telegram
        options:
          chat_id: ${TELEGRAM_JUNTAS_CHAT_ID}
          interval: 30
          max_per_run: 1
