# Copy to config.yaml and adjust.
# Secrets come from the environment or from a .env file next to this one:
# ${OLLAMA_API_KEY}, ${TELEGRAM_BOT_TOKEN}, ${TELEGRAM_CHAT_ID}, ${GOOGLECHAT_WEBHOOK_URL}.
# Write a literal dollar sign in a value as $$; comments are not expanded.

# Used when neither --log-level, -v/-q nor NEWSMERGER_LOG_LEVEL set a level.
# log_level: info

sources:
  - id: elperiodicomediterraneo-castello
    name: El Periódico Mediterraneo (Castelló ciudad)
    provider: prensaiberica_plain
    url: https://www.elperiodicomediterraneo.com/castello

  - id: castelloninformacion-castello
    name: Castellón información (Castelló ciudad)
    provider: castelloninformacion
    url: https://www.castelloninformacion.com/noticies/castello/

  - id: castellonplaza
    name: Castellón Plaza
    provider: plaza
    url: https://castellonplaza.com/castellon9/

  - id: the-guardian-spain
    name: The Guardian (Spain)
    provider: theguardian
    url: https://www.theguardian.com/world/spain

  # Any RSS or Atom feed. `options` override, for this source only, the
  # options in the provider's plugin section.
  # - id: some-blog
  #   name: Some blog
  #   provider: feedreader
  #   url: https://blog.example.com/feed.xml
  #   options:
  #     article_selector: article .post-body  # fetch the full article

cache:
  expiration: 21600

# Plugins and their options; options left out take the plugin's defaults, so
# an empty section enables a plugin as is. Providers and processors that
# `sources` and `process` name load on their own, with their defaults, after
# the plugins listed here: list them only to give them options. Remixers and
# sinks run only when listed, in this order.
plugins:
  # Providers with options.
  # feedreader:
  #   article_selector: article  # default for every feedreader source

  # LLMs, for the processors that use them. Without any, those processors
  # log an error and do nothing.
  ollama:
    api_base: http://localhost:11434
    api_key: ${OLLAMA_API_KEY}
    chat_model: gemma4:12b
    embed_model: mxbai-embed-large:latest

  # LLM processors: `llm:` picks the LLM (default: the first listed) and
  # `model:` overrides its default model, for every run of the processor.
  # summarize and embed, without a section: the first LLM and its
  # chat_model or embed_model.
  tagger:
    llm: ollama
    model: gemma4:12b

  # Remixers.
  feedgenerator:
  grouping:                          # singlelink, avglink and embeddings
  digest:                            # sends a week of articles per source
    days: 7

  # Sinks.
  telegram:
    bot_token: ${TELEGRAM_BOT_TOKEN}
    chat_id: ${TELEGRAM_CHAT_ID}
    telegram:                        # summarized items (`summary`)
      interval: 30                   # minutes between posts of the same source
    telegram_artifacts:              # artifacts, as documents
      artifacts: [digest]
  googlechat:                        # summarized items, by incoming webhook
    url: ${GOOGLECHAT_WEBHOOK_URL}   # or `channel` (space id) and `token`

# The runs of `process`, in order. Each writes one annotation key, the
# processor's own unless the entry names another with `key`; a key is written
# by one entry only. `options` override the plugin section for that run.
process:
  - markdownify                      # markdown
  - summarize                        # summary
  - tagger                           # tags
  - embed                            # tags_embedding
  - processor: embed
    options:
      input: markdown                # markdown_embedding
  # A second summary, in Spanish, with its own prompt and model:
  # - processor: summarize
  #   key: summary/es
  #   options:
  #     prompt: "Resume en español el siguiente artículo:\n\n"
  #     model: gemma4:27b
