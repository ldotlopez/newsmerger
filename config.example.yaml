# Copy to config.yaml and adjust.
# Secrets come from the environment or from a .env file next to this one:
# ${OLLAMA_API_KEY}, ${TELEGRAM_BOT_TOKEN}, ${TELEGRAM_CHAT_ID},
# ${TELEGRAM_JUNTAS_CHAT_ID}, ${GOOGLECHAT_WEBHOOK_URL}.
# Write a literal dollar sign in a value as $$; comments are not expanded.

# Used when neither --log-level, -v/-q nor NEWSMERGER_LOG_LEVEL set a level.
# log_level: info

# Lengths of time, here and in plugin options, are seconds or take a unit
# suffix: 90s, 5m, 2h, 3d, 1h30m.
cache:
  expiration: 6h

# Plugin types and the defaults of their options in every use of the type:
# the catalog entries and the workflows' own entries below override them
# (nested mappings key by key; any other value, lists included, whole).
# Options left out take the type's defaults. A section builds nothing.
plugins:
  ollama:
    api_base: http://localhost:11434
    api_key: ${OLLAMA_API_KEY}
    chat_model: gemma4:12b
    embed_model: mxbai-embed-large:latest

  # A provider's options, for every source of it.
  # feedreader:
  #   article_selector: article  # fetch the full article

  # `llm:` names the LLM by id or type (default: the first in `llms`) and
  # `model:` overrides its default model.
  tagger:
    model: gemma4:12b

  feedgenerator:
    title: Castelló news
  digest:                            # sends a week of articles per source
    lookback: 7d

  telegram:                          # summarized items; uses may name their
    bot_token: ${TELEGRAM_BOT_TOKEN} # own bot and chat
  telegram_artifacts:                # artifacts, as documents
    bot_token: ${TELEGRAM_BOT_TOKEN}
  googlechat:                        # summarized items, by incoming webhook
    url: ${GOOGLECHAT_WEBHOOK_URL}   # or `channel` (space id) and `token`

# The catalog: every configured use of a plugin type, with its `options` over
# the type's section, validated at startup and built only when a workflow
# runs it. An `id` names an entry so that workflows can refer to it; it
# cannot be a type's name.
#
# The `default` workflow runs, in order, every source, processor and remixer
# without `skip_default: true`; it delivers nothing. `skip_default` only
# leaves an entry out of `default`: the workflows that name it still run it.

# LLMs, for the processors and remixers that use one.
llms:
  - ollama

sources:
  - id: elperiodicomediterraneo-castello
    name: El Periódico Mediterraneo (Castelló ciudad)
    provider: prensaiberica_plain
    url: https://www.elperiodicomediterraneo.com/castello

  - id: castelloninformacion-castello
    name: Castellón información (Castelló ciudad)
    provider: castelloninformacion
    url: https://www.castelloninformacion.com/noticies/castello/

  - id: castellonplaza
    name: Castellón Plaza
    provider: plaza
    url: https://castellonplaza.com/castellon9/

  - id: the-guardian-spain
    name: The Guardian (Spain)
    provider: theguardian
    url: https://www.theguardian.com/world/spain

  # Used only by the workflows that name it (see `workflows` below).
  - id: juntagobiernolocal
    name: Junta de Gobierno Local
    provider: csjuntasgobierno
    url: https://www.castello.es/es/sesiones
    skip_default: true

  # Any RSS or Atom feed. `options` override, for this source only, the
  # options in the provider's plugin section.
  # - id: some-blog
  #   name: Some blog
  #   provider: feedreader
  #   url: https://blog.example.com/feed.xml
  #   options:
  #     article_selector: article .post-body  # fetch the full article

# Each processor run writes one annotation key, the processor's own unless the
# entry names another with `key`. On shared sources a key is written by one
# processor type; other options for it only get a warning (the first run to
# process an item writes it).
processors:
  - markdownify                      # markdown
  - summarize                        # summary
  - tagger                           # tags
  - embed                            # tags_embedding
  - processor: embed
    options:
      input: markdown                # markdown_embedding
  # A second summary, in Spanish, with its own prompt and model, for the
  # workflows that name it:
  # - processor: summarize
  #   id: summary-es
  #   key: summary/es
  #   skip_default: true
  #   options:
  #     prompt: "Resume en español el siguiente artículo:\n\n"
  #     model: gemma4:27b

# Each remix run saves its artifacts under its key, the remixer's own unless
# the entry names another; a key belongs to one workflow.
remixers:
  - feedgenerator                    # feedgenerator/feed
  - singlelink
  - avglink
  - embeddings
  - digest                           # digest/<source>/<since>_<until>
  # - remixer: feedgenerator         # short/feed
  #   key: short
  #   options: {title: Headlines, max_items: 10}

# Each delivery records what it sent under `<workflow>/<key>`, the key being
# the sink's name unless the entry names another; keys are unique per
# workflow. Every sink takes `interval` (time between deliveries, oldest
# first; default 0), `max_per_run` (default 5), `max_retries` and `lookback`.
sinks:
  - sink: telegram                   # summarized items
    id: telegram-main
    options:
      chat_id: ${TELEGRAM_CHAT_ID}
      interval: 30m
      item_image: true               # the item's image as a photo, if any
      item_url_text: original article # the link to the article
      summary: summary               # the annotation posted, e.g. summary/es
      item_url_preview: false        # Telegram's link preview, text posts only
  - sink: telegram_artifacts
    id: telegram-digests
    options:
      chat_id: ${TELEGRAM_CHAT_ID}
      artifacts: [digest]
  - sink: googlechat
    id: chat-main
    options:
      item_image: true               # the item's image in the card, if any
      item_url_text: original article # the button to the article
      summary: summary               # the annotation posted, e.g. summary/es

# Workflows, run with `-w NAME` (one cron line each). A workflow sees only its
# sources. Entries are catalog ids, type names (the type with its section's
# options) or entries of the workflow's own, which have no `id`. A workflow
# may only deliver what others process on its sources.
workflows:
  - name: main-channels
    sources:
      - elperiodicomediterraneo-castello
      - castelloninformacion-castello
      - castellonplaza
      - the-guardian-spain
    deliver: [telegram-main, telegram-digests, chat-main]

  - name: juntas-channel
    sources: [juntagobiernolocal]
    process: [markdownify, summarize]
    deliver:
      - sink: telegram
        options:
          chat_id: ${TELEGRAM_JUNTAS_CHAT_ID}
          interval: 30m
          max_per_run: 1
