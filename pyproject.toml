[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newstool"
version = "0.1.0"
description = "Collects news from websites and builds markdown copies, LLM summaries and tags, RSS feeds, digests and Telegram posts from them."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Luis López", email = "luis@cuarentaydos.com" }]
keywords = ["news", "scraper", "rss", "feeds", "llm", "ollama", "telegram", "summarization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing :: Markup",
]
requires-python = ">=3.13"
dependencies = [
    "foundation[scraping]",
    "bs4>=0.0.2",
    "click>=8.3.3",
    "html5lib>=1.1",
    "pydantic>=2.13.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "rich-click>=1.9.7",
    "sqlalchemy>=2.0.51",
    "feedparser>=6.0.14",
    "ollama>=0.6.2",
    "python-dotenv>=1.2.4",
    "pymupdf>=2.0",
    "pytimeparse2>=1.7.1",
    "platformdirs>=4.13.3",
    "pyyaml>=6.0.3",
    "trafilatura>=2.3.1",
]

[project.scripts]
newstool = "newstool.cli:cli"


[project.urls]
Homepage = "https://github.com/ldotlopez/newstool"
Repository = "https://github.com/ldotlopez/newstool"
Issues = "https://github.com/ldotlopez/newstool/issues"

[dependency-groups]
dev = [
    "ipython>=9.13.0",
    "pre-commit>=4.6.0",
]


[tool.uv.sources]
foundation = { git = "https://github.com/ldotlopez/foundation.git", branch = "main" }
