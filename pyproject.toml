[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news-aggregator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "foundation[scraping]",
    "bs4>=0.0.2",
    "click>=8.3.3",
    "html5lib>=1.1",
    "pydantic>=2.13.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "rich-click>=1.9.7",
    "sqlalchemy>=2.0.51",
    "feedparser>=6.0.14",
    "ollama>=0.6.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
newsmerger = "newsmerger.cli:cli"


[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "ipython>=9.13.0",
    "pre-commit>=4.6.0",
]
tagging = [
    "ollama>=0.6.2",
]
feeds = [
    "feedparser>=6.0.12",
]

[tool.uv.sources]
foundation = { git = "https://github.com/ldotlopez/foundation.git", branch = "p2-rich-per-stream" }
