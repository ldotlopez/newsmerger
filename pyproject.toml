[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news-aggregator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "foundation>=0.1.0",
    "bs4>=0.0.2",
    "click>=8.3.3",
    "html5lib>=1.1",
    "pydantic>=2.13.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "rich-click>=1.9.7",
]

[project.scripts]
newsmerger = "newsmerger.cli:cli"

[tool.uv.sources]
foundation = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "ipython>=9.13.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]
